<!doctype html>
<!-- Source for src/assets/og.png (1200×630). Edit, then run `npm run og`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../src/assets/fonts/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../src/assets/fonts/jetbrains-mono.woff2') format('woff2');
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #1e1f1c;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 620px 420px at 980px 520px, rgba(48, 156, 255, 0.28), transparent 70%),
          radial-gradient(rgba(248, 248, 242, 0.07) 1px, transparent 1.3px) 0 0 / 26px 26px,
          #1e1f1c;
        color: #f8f8f2;
        font-family: 'Geist', sans-serif;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 60px;
        height: 60px;
        border-radius: 14px;
      }
      .brand span {
        font: 800 44px/1 'JetBrains Mono', monospace;
        letter-spacing: -0.02em;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 176px;
        width: 560px;
        margin: 0;
        font-size: 64px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.045em;
      }
      .accent {
        color: #309cff;
      }
      .cursor {
        display: inline-block;
        width: 26px;
        height: 11px;
        margin-left: 6px;
        background: #309cff;
      }
      .sub {
        position: absolute;
        left: 72px;
        top: 420px;
        width: 520px;
        margin: 0;
        font-size: 25px;
        line-height: 1.4;
        color: #c4c4b8;
      }
      .tags {
        position: absolute;
        left: 72px;
        bottom: 60px;
        display: flex;
        gap: 10px;
      }
      .tags span {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #3b3c35;
        background: #272822;
        font: 600 17px 'JetBrains Mono', monospace;
        color: #c4c4b8;
      }
      .tags b {
        color: #309cff;
        font-weight: 700;
      }
      .shot {
        position: absolute;
        left: 652px;
        top: 96px;
        width: 640px;
        height: 620px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #45463e;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 0 0 8px rgba(248, 248, 242, 0.03);
        background: #1e1f1c;
      }
      .shot img {
        position: absolute;
        /* Show the diff and the agent panel from the right half of the screenshot. */
        width: 1180px;
        left: -470px;
        top: -6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="../src/assets/logo.svg" alt="" />
        <span>typist</span>
      </div>
      <h1>The AI code editor that runs on <span class="accent">your machine</span><span class="cursor"></span></h1>
      <p class="sub">An agent, inline edits and autocomplete with local models through Ollama.</p>
      <div class="tags">
        <span><b>⌘I</b> agent</span>
        <span><b>⌘K</b> edit</span>
        <span><b>⇥</b> complete</span>
      </div>
      <div class="shot"><img src="../src/assets/screenshot@2x.png" alt="" /></div>
    </div>
  </body>
</html>
